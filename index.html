<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Pay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #3a3a3a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper img {
      max-width: 520px;
      width: 90%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="logo-wrapper">
    <img src="logo.png" alt="Ultimate Pay Logo" />
  </div>
</body>
</html>
